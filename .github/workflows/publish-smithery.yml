name: Publish Smithery

on:
  workflow_dispatch:
    inputs:
      resume:
        description: Resume a publish paused for OAuth authorization
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}

    steps:
      - name: Validate publishing secret
        run: test -n "$SMITHERY_API_KEY"

      - name: Claim Qoory namespace
        if: ${{ !inputs.resume }}
        run: |
          curl --fail-with-body --request PUT \
            --url https://api.smithery.ai/namespaces/qoory-ai \
            --header "Authorization: Bearer $SMITHERY_API_KEY"

      - name: Publish Qoory Remote MCP
        if: ${{ !inputs.resume }}
        run: |
          npx --yes smithery@1.1.1 mcp publish \
            https://api.qoory.ai/mcp \
            --name qoory-ai/qoory

      - name: Resume OAuth-authorized publish
        if: ${{ inputs.resume }}
        run: |
          curl --fail-with-body --request POST \
            --url https://api.smithery.ai/servers/qoory-ai%2Fqoory/releases/latest/resume \
            --header "Authorization: Bearer $SMITHERY_API_KEY"

      - name: Verify Smithery release
        run: |
          for attempt in {1..30}; do
            releases="$(
              curl --fail-with-body --silent \
                --url https://api.smithery.ai/servers/qoory-ai%2Fqoory/releases \
                --header "Authorization: Bearer $SMITHERY_API_KEY"
            )"
            status="$(jq --raw-output '(.releases // .)[0].status' <<<"$releases")"
            echo "Smithery release status: $status"

            case "$status" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|FAILURE_SCAN|INTERNAL_ERROR|CANCELLED)
                exit 1
                ;;
              AUTH_REQUIRED)
                echo "Authorize the release at https://smithery.ai/servers/qoory-ai/qoory/releases"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Smithery release did not finish within five minutes."
          exit 1

      - name: Publish Smithery catalog metadata
        run: |
          curl --fail-with-body --request PATCH \
            --url https://api.smithery.ai/servers/qoory-ai%2Fqoory \
            --header "Authorization: Bearer $SMITHERY_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{
              "displayName": "Qoory Crypto Intelligence",
              "description": "Research crypto projects, markets, narratives, news, funding, people, funds, tokens, events, and X accounts with live Qoory intelligence.",
              "homepage": "https://docs.qoory.ai/developers/remote-mcp",
              "unlisted": false
            }'
